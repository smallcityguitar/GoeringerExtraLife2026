<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Arcade Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Palette + type taken from the Extra Life / DonorDrive participant pages:
     navy #253746, yellow #FFCB05, teal #0E7CA2, cyan #00A0D5, ice #EBF7FC; Open Sans body + heavy geometric headings. */
  :root {
    --accent: #FFCB05;           /* yellow (donate buttons, highlights) - changeable from the control panel */
    --navy: #253746;
    --navy-deep: #16222d;
    --teal: #0E7CA2;
    --cyan: #00A0D5;
    --ice: #EBF7FC;
    --text: #ffffff;
    --dim: #a9bccb;
    --line: #e3eaf0;
    --on-accent: #253746;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--navy-deep); color: var(--text); overflow: hidden; cursor: none; }
  /* 1u = 1% of the screen width on 16:9, scales down on taller screens (Steam Deck is 16:10) */
  body { --u: min(1vw, 1.7778vh); font-family: 'Open Sans', Arial, sans-serif; font-weight: 700; }
  .num, .head-font { font-family: 'Montserrat', 'Open Sans', Arial, sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; }

  #app {
    position: fixed; inset: 0;
    display: grid; grid-template-rows: 1fr auto; gap: calc(var(--u) * 1.6);
    padding: calc(var(--u) * 2.2) calc(var(--u) * 3);
    background:
      radial-gradient(90% 70% at 100% 100%, rgba(0, 160, 213, 0.22), transparent 60%),
      linear-gradient(155deg, #2e4659 0%, var(--navy) 38%, #1a2a37 100%);
  }

  /* floating total chip + footer */
  #hud {
    position: fixed; top: calc(var(--u) * 2.2); right: calc(var(--u) * 3); z-index: 5;
    font-size: calc(var(--u) * 2.1); background: var(--accent); color: var(--on-accent);
    padding: calc(var(--u) * 0.55) calc(var(--u) * 1.8); border-radius: 999px;
    opacity: 0; transition: opacity 0.5s;
  }
  #hud.on { opacity: 1; }
  body[data-scene="goals"] #hud { opacity: 0; }
  #foot { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * 2); font-size: calc(var(--u) * 1.45); color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; }
  #foot b { color: #fff; font-weight: 800; }
  #donate {
    background: var(--accent); color: var(--on-accent); border-radius: 999px; text-transform: none; letter-spacing: 0.02em;
    font-size: calc(var(--u) * 1.9); font-weight: 800; padding: calc(var(--u) * 0.7) calc(var(--u) * 2.2); white-space: nowrap;
  }

  /* scenes */
  #stage { position: relative; min-height: 0; }
  .scene {
    position: absolute; inset: 0; opacity: 0; pointer-events: none; visibility: hidden;
    transition: opacity 0.6s, visibility 0s 0.6s;
    display: flex; flex-direction: column; justify-content: center;
  }
  .scene.active { opacity: 1; visibility: visible; transition: opacity 0.6s; }
  .label { font-size: calc(var(--u) * 2.4); letter-spacing: 0.16em; color: var(--accent); text-transform: uppercase; font-weight: 800; }

  /* goals */
  #scene-goals { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: calc(var(--u) * 3); align-items: center; justify-content: stretch; align-content: center; }
  #scene-goals > * { min-width: 0; }
  .raised { font-size: calc(var(--u) * 10.5); line-height: 1.05; color: #fff; letter-spacing: -0.01em; }
  .goalrow { display: flex; justify-content: space-between; align-items: baseline; margin: calc(var(--u) * 0.8) 0 calc(var(--u) * 1.2); font-size: calc(var(--u) * 2.5); font-weight: 800; }
  .goalrow .pct { color: var(--accent); }

  /* pill progress bar with milestone dots, like the participant page */
  .barwrap { position: relative; }
  .bar { position: relative; height: calc(var(--u) * 4.6); border-radius: 999px; background: var(--navy-deep); border: 3px solid rgba(255, 255, 255, 0.28); }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--teal), var(--cyan)); transition: width 1.4s cubic-bezier(.2, .8, .2, 1); }
  #dots, .dots { position: absolute; inset: 0; pointer-events: none; }
  .dot {
    position: absolute; top: 50%; width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5); border-radius: 50%;
    background: #fff; transform: translate(-50%, -50%); box-shadow: 0 0 0 3px rgba(22, 34, 45, 0.55);
  }
  .dot.hit { background: var(--accent); }
  .bar.smashed { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 calc(var(--u) * 3) var(--accent); } }
  #teamLine { margin-top: calc(var(--u) * 1.4); font-size: calc(var(--u) * 1.9); color: var(--dim); min-height: 1em; font-weight: 600; }
  #teamLine b { color: #fff; font-weight: 800; }
  #goalsHead { margin-top: calc(var(--u) * 1.6); font-size: calc(var(--u) * 1.6); letter-spacing: 0.14em; color: var(--dim); font-weight: 800; }
  #goalsList { margin-top: calc(var(--u) * 0.8); display: grid; gap: calc(var(--u) * 0.7); }
  .sg { display: flex; align-items: baseline; gap: calc(var(--u) * 1.2); font-size: calc(var(--u) * 2.1); }
  .sg .tick { width: 1.4em; text-align: center; color: var(--dim); }
  .sg .amt { color: var(--accent); min-width: 6.5em; }
  .sg .lbl { font-weight: 600; font-style: italic; }
  .sg.done { color: var(--dim); }
  .sg.done .tick { color: var(--accent); }
  .sg.done .amt { color: var(--dim); text-decoration: line-through; }

  /* light "card" panels like the site's white cards */
  .panel { background: #fff; color: var(--navy); border-radius: calc(var(--u) * 1.2); padding: calc(var(--u) * 2) calc(var(--u) * 2.2); box-shadow: 0 calc(var(--u) * 0.6) calc(var(--u) * 3) rgba(0, 0, 0, 0.35); }
  .panel h2 { font-family: 'Montserrat', 'Open Sans', sans-serif; font-weight: 800; font-size: calc(var(--u) * 1.9); letter-spacing: 0.08em; color: var(--teal); margin-bottom: calc(var(--u) * 1.2); }
  .don { padding: calc(var(--u) * 0.9) 0; border-top: 1px solid var(--line); }
  .don:first-child { border-top: 0; padding-top: 0; }
  .don .row { display: flex; justify-content: space-between; gap: calc(var(--u) * 1.5); font-size: calc(var(--u) * 2.3); }
  .don .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
  .don .amt { color: var(--teal); }
  .don .msg {
    font-size: calc(var(--u) * 1.7); color: #52667a; font-weight: 600; margin-top: calc(var(--u) * 0.2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .empty { color: #6b7f90; font-size: calc(var(--u) * 2); }
  #scene-stream .empty { color: var(--dim); }

  /* donor wall */
  #scene-donors .panel { padding: calc(var(--u) * 2.4) calc(var(--u) * 3); }
  #scene-donors .don .row { font-size: calc(var(--u) * 3.1); }
  #scene-donors .don .msg { font-size: calc(var(--u) * 2.1); }
  #scene-donors h2 { font-size: calc(var(--u) * 2.4); }

  /* timers */
  #scene-countdown, #scene-uptime { align-items: center; text-align: center; }
  .big { font-size: calc(var(--u) * 17); line-height: 1.1; margin: calc(var(--u) * 1.5) 0; color: #fff; text-shadow: 0 0 calc(var(--u) * 2.4) rgba(0, 160, 213, 0.4); }
  .sub { font-size: calc(var(--u) * 2.6); color: var(--dim); letter-spacing: 0.06em; font-weight: 700; }

  /* guest stream */
  #scene-stream { justify-content: stretch; }
  #streamWrap { position: relative; flex: 1; min-height: 0; border: 3px solid var(--accent); border-radius: calc(var(--u) * 1.2); overflow: hidden; background: #000; }
  #twitch { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #streamLabel {
    position: absolute; left: calc(var(--u) * 1.5); bottom: calc(var(--u) * 1.5); z-index: 2;
    background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: calc(var(--u) * 0.4) calc(var(--u) * 1.6);
    font-size: calc(var(--u) * 1.9); letter-spacing: 0.04em; font-weight: 800;
  }
  #streamEmpty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 2em; }

  /* message */
  #scene-message { align-items: center; text-align: center; padding: 0 calc(var(--u) * 6); }
  #msgTitle { font-family: 'Montserrat', 'Open Sans', sans-serif; font-weight: 900; font-size: calc(var(--u) * 8); color: var(--accent); line-height: 1.1; }
  #msgBody { font-size: calc(var(--u) * 3.6); margin-top: calc(var(--u) * 1.6); line-height: 1.25; white-space: pre-wrap; font-weight: 600; }

  /* donation alert */
  #alertbg { position: fixed; inset: 0; background: rgba(14, 22, 30, 0.8); opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 20; }
  #alert {
    position: fixed; left: 50%; top: 50%; z-index: 21; width: 80%; text-align: center;
    transform: translate(-50%, -46%) scale(0.85); opacity: 0; pointer-events: none;
    transition: opacity 0.4s, transform 0.5s cubic-bezier(.2, 1.4, .3, 1);
    padding: calc(var(--u) * 3) calc(var(--u) * 4); border-radius: calc(var(--u) * 2);
    background: #fff; color: var(--navy);
    box-shadow: 0 0 0 calc(var(--u) * 0.5) var(--accent), 0 0 calc(var(--u) * 5) rgba(255, 203, 5, 0.45);
  }
  body.alerting #alertbg { opacity: 1; }
  body.alerting #alert { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #alert .kicker { display: inline-block; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: calc(var(--u) * 0.5) calc(var(--u) * 2.4); font-size: calc(var(--u) * 2.2); letter-spacing: 0.12em; font-weight: 800; }
  #alName { font-size: calc(var(--u) * 5); margin-top: calc(var(--u) * 1.2); overflow-wrap: anywhere; }
  #alAmt { font-size: calc(var(--u) * 11); color: var(--teal); line-height: 1.1; }
  #alMsg { font-size: calc(var(--u) * 3); font-weight: 600; margin-top: calc(var(--u) * 1); line-height: 1.25; color: #52667a; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }


  /* progress tile: only used on tall (portrait) screens */
  #progTile, #mileTile { display: none; }
  .empty-tile { display: none !important; }
  #mTeam { margin-top: calc(var(--u) * 1.2); font-size: calc(var(--u) * 1.9); color: var(--dim); font-weight: 600; }
  #mTeam b { color: #fff; font-weight: 800; }
  #mList { margin-top: calc(var(--u) * 1); display: grid; gap: calc(var(--u) * 0.8); }
  #mList .sg { font-size: calc(var(--u) * 2.2); }
  #mList .sg .amt { min-width: 3.5em; }
  .tile { background: rgba(14, 22, 30, 0.45); border: 2px solid rgba(255, 255, 255, 0.18); border-radius: calc(var(--u) * 1.2); padding: calc(var(--u) * 2.2) calc(var(--u) * 2.4); }
  #pNext { margin-top: calc(var(--u) * 1.4); font-size: calc(var(--u) * 2); color: var(--dim); font-weight: 600; min-height: 1em; }
  #pNext b { color: var(--accent); font-weight: 800; }

  /* ===== TALL / PORTRAIT screens (e.g. a vertically rotated arcade monitor) ===== */
  @media (max-aspect-ratio: 1/1) {
    body { --u: min(1.6vw, 0.9vh); }
    #app { padding: calc(var(--u) * 2.4) calc(var(--u) * 2.4); gap: calc(var(--u) * 2); }
    #foot { flex-direction: column; gap: calc(var(--u) * 1.2); text-align: center; font-size: calc(var(--u) * 1.5); }
    #donate { font-size: calc(var(--u) * 2.2); }
    #scene-goals { grid-template-columns: minmax(0, 1fr); gap: calc(var(--u) * 3); align-content: center; }
    .raised { font-size: calc(var(--u) * 9.5); }
    .big { font-size: calc(var(--u) * 10.5); }
    #scene-donors { gap: calc(var(--u) * 2.4); justify-content: center; }
    #progTile, #mileTile { display: block; }
    body[data-scene="donors"] #hud { opacity: 0; }
    #scene-donors .panel { padding: calc(var(--u) * 2.4) calc(var(--u) * 2.4); }
    #scene-donors .don .row { font-size: calc(var(--u) * 2.9); }
    #scene-donors .don .msg { font-size: calc(var(--u) * 1.9); }
    #msgTitle { font-size: calc(var(--u) * 7); }
    #msgBody { font-size: calc(var(--u) * 3.2); }
    #alert { width: 90%; }
  }

  #conn { position: fixed; left: calc(var(--u) * 1); bottom: calc(var(--u) * 1); font-size: calc(var(--u) * 1.3); color: #ffb3b3; opacity: 0; transition: opacity 0.4s; z-index: 30; }
  #conn.on { opacity: 0.9; }
</style>
</head>
<body data-scene="goals">
<div id="app">
  <div id="hud" class="num"></div>

  <main id="stage">
    <!-- GOALS -->
    <section class="scene" id="scene-goals">
      <div>
        <div class="label" id="raisedLabel">RAISED SO FAR</div>
        <div class="raised num" id="raised">$0</div>
        <div class="goalrow"><span id="goalText"></span><span class="pct num" id="pct"></span></div>
        <div class="barwrap">
          <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
          <div id="dots"></div>
        </div>
        <div id="teamLine"></div>
        <div id="goalsHead">MILESTONES</div>
        <div id="goalsList"></div>
      </div>
      <div class="panel">
        <h2>RECENT DONORS</h2>
        <div id="donList"></div>
      </div>
    </section>

    <!-- DONOR WALL -->
    <section class="scene" id="scene-donors">
      <div class="tile" id="progTile">
        <div class="label" id="pLabel">RAISED SO FAR</div>
        <div class="raised num" id="pRaised">$0</div>
        <div class="goalrow"><span id="pGoal"></span><span class="pct num" id="pPct"></span></div>
        <div class="barwrap">
          <div class="bar"><div class="fill" id="pFill"></div></div>
          <div id="pDots" class="dots"></div>
        </div>
        <div id="pNext"></div>
      </div>
      <div class="panel" id="wallPanel">
        <h2>DONOR WALL &mdash; THANK YOU!</h2>
        <div id="wallList"></div>
      </div>
      <div class="tile" id="mileTile">
        <div class="label" style="font-size:calc(var(--u) * 2)">MILESTONES</div>
        <div id="mTeam"></div>
        <div id="mList"></div>
      </div>
    </section>

    <!-- COUNTDOWN -->
    <section class="scene" id="scene-countdown">
      <div class="label" id="cdLabel"></div>
      <div class="big num" id="cdTime">--:--:--</div>
      <div class="sub" id="cdSub"></div>
    </section>

    <!-- UPTIME -->
    <section class="scene" id="scene-uptime">
      <div class="label" id="upLabel"></div>
      <div class="big num" id="upTime">--:--:--</div>
      <div class="sub" id="upSub"></div>
    </section>

    <!-- GUEST STREAM -->
    <section class="scene" id="scene-stream">
      <div id="streamWrap">
        <iframe id="twitch" title="Guest stream" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <div id="streamEmpty" class="empty">No guest streamers yet. Add some in the control panel.</div>
        <div id="streamLabel"></div>
      </div>
    </section>

    <!-- MESSAGE -->
    <section class="scene" id="scene-message">
      <div id="msgTitle"></div>
      <div id="msgBody"></div>
    </section>
  </main>

  <footer id="foot">
    <span>Playing for <b>Children's Miracle Network Hospitals</b></span>
    <span id="donate">extra-life.org</span>
  </footer>
</div>

<div id="alertbg"></div>
<div id="alert">
  <div class="kicker">NEW DONATION!</div>
  <div id="alName" class="num"></div>
  <div id="alAmt" class="num"></div>
  <div id="alMsg"></div>
</div>
<div id="conn">reconnecting&hellip;</div>

<script>
(function () {
  'use strict';
  var qs = new URLSearchParams(location.search);
  var PREVIEW = qs.has('preview');                       // embedded in the control panel: no polling, state comes via postMessage
  var POLL_MS = Math.max(2, Number(qs.get('poll')) || 4) * 1000;
  var EL_MS = 15000;                                     // Extra Life data refresh

  var state = null, offset = 0, current = '', fails = 0;
  var el = { participant: null, donations: [], milestones: [], team: null };
  var seen = null, seenPid = '', lastNonce = null, streamSince = 0;
  var alertQueue = [], alerting = false, streamKey = '';

  function $(id) { return document.getElementById(id); }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function now() { return Date.now() + offset; }

  var fmt0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  var fmt2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 });
  function money(n) { n = Number(n) || 0; return Math.round(n * 100) % 100 === 0 ? fmt0.format(n) : fmt2.format(n); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDur(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
  }

  /* ---------- state ---------- */
  function applyState(s, serverTime) {
    if (typeof serverTime === 'number') offset = serverTime - Date.now();
    if (!s) return;
    var first = state === null;
    if (!first && s.rev === state.rev) return;
    var pidChanged = first || s.participantId !== state.participantId || s.teamId !== state.teamId;
    var streamChanged = first || JSON.stringify([s.streamers, s.streamCycle, s.streamPinned]) !== JSON.stringify([state.streamers, state.streamCycle, state.streamPinned]);
    state = s;
    if (streamChanged) streamSince = Date.now();
    var nonce = s.testAlert && s.testAlert.nonce;
    // Only a genuinely newer, real test alert pops up. An older/empty value (e.g. a server instance that
    // doesn't remember the last test) is ignored instead of showing a bogus "Anonymous $0" alert.
    nonce = Number(nonce) || 0;
    if (lastNonce === null) lastNonce = nonce;
    else if (nonce > lastNonce) {
      lastNonce = nonce;
      if (s.testAlert && Number(s.testAlert.amount) > 0) queueAlert({ name: s.testAlert.name, amount: s.testAlert.amount, message: s.testAlert.message });
    }
    renderStatic();
    syncStream(current);
    tick();
    if (pidChanged) fetchEL();
  }

  function shortUrl(u) { return String(u || '').trim().replace(/^[a-z][a-z0-9+.-]*:\/\//i, '').replace(/^www\./i, '').replace(/\/+$/, ''); }
  function renderStatic() {
    document.documentElement.style.setProperty('--accent', state.accent || '#FFCB05');
    var du = shortUrl(state.donateUrl);
    $('donate').textContent = 'Donate: ' + (du || 'extra-life.org' + (state.participantId ? '/participants/' + state.participantId : ''));
    $('msgTitle').textContent = state.messageTitle || '';
    $('msgTitle').style.display = state.messageTitle ? 'block' : 'none';
    $('msgBody').textContent = state.message || '';
    renderEL();
  }

  /* ---------- Extra Life data ---------- */
  function renderEL() {
    if (!state) return;
    updateGoals(); updateDonors(); updateHud();
    fitTall();
  }

  // Tall screens: show as many donor rows as fit. Drop rows down to 4, then the milestones tile, then more rows.
  function fitTall() {
    var sc = $('scene-donors'), wl = $('wallList'), mt = $('mileTile');
    if (!sc || !window.matchMedia || !window.matchMedia('(max-aspect-ratio: 1/1)').matches) return;
    var over = function () { return sc.scrollHeight > sc.clientHeight + 1; };
    mt.style.visibility = ''; mt.style.display = '';
    while (over() && wl.children.length > 4) wl.removeChild(wl.lastChild);
    if (over() && !mt.classList.contains('empty-tile')) mt.style.display = 'none';
    while (over() && wl.children.length > 1) wl.removeChild(wl.lastChild);
  }
  window.addEventListener('resize', function () { if (state) { updateDonors(); fitTall(); } });

  function updateHud() {
    var p = el.participant, hud = $('hud');
    if (!p) { hud.classList.remove('on'); return; }
    hud.textContent = money(p.sumDonations) + (p.fundraisingGoal ? ' / ' + money(p.fundraisingGoal) : '');
    hud.classList.add('on');
  }

  function updateGoals() {
    var p = el.participant, has = !!state.participantId;
    var raised = p ? Number(p.sumDonations) || 0 : 0;
    var goal = p ? Number(p.fundraisingGoal) || 0 : 0;
    $('raised').textContent = money(raised);
    $('goalText').textContent = !has ? 'SET YOUR PARTICIPANT ID IN THE CONTROL PANEL' : (!p ? 'LOADING…' : (goal ? 'GOAL ' + money(goal) : ''));
    $('pct').textContent = goal ? Math.floor((raised / goal) * 100) + '%' : '';
    $('fill').style.width = (goal ? Math.min(100, (raised / goal) * 100) : 0) + '%';
    var smashed = goal > 0 && raised >= goal;
    $('bar').classList.toggle('smashed', smashed);
    $('raisedLabel').textContent = smashed ? 'GOAL SMASHED!' : 'RAISED SO FAR';

    var tl = $('teamLine'); clear(tl);
    if (el.team && el.team.name) {
      tl.appendChild(document.createTextNode('TEAM '));
      tl.appendChild(h('b', null, el.team.name));
      tl.appendChild(document.createTextNode(' · ' + money(el.team.sumDonations) + (el.team.fundraisingGoal ? ' / ' + money(el.team.fundraisingGoal) : '')));
    }

    // milestones: custom stretch goals from the control panel + Extra Life milestones
    var items = [], keys = {};
    (state.stretchGoals || []).concat(el.milestones || []).forEach(function (g) {
      var k = g.amount + '|' + g.label;
      if (!keys[k]) { keys[k] = 1; items.push({ amount: Number(g.amount), label: g.label }); }
    });
    items.sort(function (a, b) { return a.amount - b.amount; });

    var dots = $('dots'), pd = $('pDots'); clear(dots); clear(pd);   // milestone dots on the bar (both bars)
    if (goal) items.forEach(function (g) {
      if (g.amount > 0 && g.amount <= goal) {
        [dots, pd].forEach(function (box) {
          var d = h('span', 'dot' + (g.amount <= raised ? ' hit' : ''));
          d.style.left = (g.amount / goal * 100) + '%';
          box.appendChild(d);
        });
      }
    });

    // progress tile (tall screens)
    $('pRaised').textContent = money(raised);
    $('pGoal').textContent = $('goalText').textContent;
    $('pPct').textContent = $('pct').textContent;
    $('pFill').style.width = $('fill').style.width;
    $('pLabel').textContent = $('raisedLabel').textContent;
    var nx = items.filter(function (g) { return g.amount > raised; })[0], pn = $('pNext'); clear(pn);
    if (nx) { pn.appendChild(document.createTextNode('NEXT: ')); pn.appendChild(h('b', 'num', money(nx.amount))); pn.appendChild(document.createTextNode(' · ' + nx.label)); }

    var reached = items.filter(function (g) { return g.amount <= raised; });
    var next = items.filter(function (g) { return g.amount > raised; });
    var show = reached.slice(-1).concat(next).slice(0, 4);
    $('goalsHead').style.display = show.length ? 'block' : 'none';
    var gl = $('goalsList'); clear(gl);
    show.forEach(function (g) {
      var done = g.amount <= raised;
      var row = h('div', 'sg' + (done ? ' done' : ''));
      row.appendChild(h('span', 'tick', done ? '✔' : '○'));
      row.appendChild(h('span', 'amt num', money(g.amount)));
      row.appendChild(h('span', 'lbl', g.label));
      gl.appendChild(row);
    });
    // milestones tile (tall screens): copy of the team line + milestone rows
    var mt = $('mTeam'), ml = $('mList'); clear(mt); clear(ml);
    Array.prototype.forEach.call($('teamLine').childNodes, function (n) { mt.appendChild(n.cloneNode(true)); });
    Array.prototype.forEach.call(gl.childNodes, function (n) { ml.appendChild(n.cloneNode(true)); });
    $('mileTile').classList.toggle('empty-tile', !gl.childNodes.length && !mt.childNodes.length);
  }

  function donRow(d) {
    var row = h('div', 'don');
    var top = h('div', 'row');
    top.appendChild(h('span', 'who', d.name || 'Anonymous'));
    top.appendChild(h('span', 'amt num', money(d.amount)));
    row.appendChild(top);
    if (d.message) row.appendChild(h('div', 'msg', d.message));
    return row;
  }

  function updateDonors() {
    var list = el.donations || [];
    var dl = $('donList'); clear(dl);
    if (!list.length) dl.appendChild(h('div', 'empty', state.participantId ? 'Be the first to donate!' : 'No participant set'));
    list.slice(0, 5).forEach(function (d) { dl.appendChild(donRow(d)); });
    var wl = $('wallList'); clear(wl);
    if (!list.length) wl.appendChild(h('div', 'empty', 'Be the first to donate!'));
    var tall = window.matchMedia && window.matchMedia('(max-aspect-ratio: 1/1)').matches;
    list.slice(0, tall ? 12 : 5).forEach(function (d) { wl.appendChild(donRow(d)); });
  }

  function fetchEL() {
    if (!state) return Promise.resolve();
    if (!state.participantId) {
      el = { participant: null, donations: [], milestones: [], team: null };
      renderEL();
      return Promise.resolve();
    }
    var url = '/api/extralife?pid=' + encodeURIComponent(state.participantId) + (state.teamId ? '&tid=' + encodeURIComponent(state.teamId) : '');
    return fetch(url, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        el = { participant: d.participant, donations: d.donations || [], milestones: d.milestones || [], team: d.team || null };
        detectDonations(el.donations);
        renderEL();
      })
      .catch(function () { /* keep showing the last good data */ });
  }

  function detectDonations(list) {
    if (seen === null || seenPid !== state.participantId) {   // first load: don't alert for old donations
      seen = {}; seenPid = state.participantId;
      list.forEach(function (d) { seen[d.id] = 1; });
      return;
    }
    var fresh = list.filter(function (d) { return !seen[d.id]; })
      .sort(function (a, b) { return Date.parse(a.createdAt) - Date.parse(b.createdAt); });
    fresh.forEach(function (d) { seen[d.id] = 1; if (state.alerts) queueAlert(d); });
  }

  /* ---------- alerts ---------- */
  function queueAlert(d) {
    if (alertQueue.length < 10) alertQueue.push(d);
    if (!alerting) nextAlert();
  }
  function nextAlert() {
    var d = alertQueue.shift();
    if (!d) { alerting = false; return; }
    alerting = true;
    $('alName').textContent = d.name || 'Anonymous';
    $('alAmt').textContent = money(d.amount);
    var m = $('alMsg'); m.textContent = d.message || ''; m.style.display = d.message ? '-webkit-box' : 'none';
    document.body.classList.add('alerting');
    setTimeout(function () {
      document.body.classList.remove('alerting');
      setTimeout(nextAlert, 700);
    }, 9000);
  }

  /* ---------- scenes ---------- */
  function usable(name) {
    if (name === 'stream') return !!(state.streamers && state.streamers.length);
    if (name === 'message') return !!(state.message || state.messageTitle);
    return true;
  }
  function activeScene() {
    var r = state.rotation;
    if (r && r.enabled && r.scenes && r.scenes.length) {
      var list = r.scenes.filter(usable);
      if (list.length) {
        var idx = Math.max(0, Math.floor((now() - r.startedAt) / (r.seconds * 1000))) % list.length;
        return list[idx];
      }
    }
    return state.scene;
  }

  function setActive(name) {
    current = name;
    if (name === 'stream') streamSince = Date.now();         // cycling starts from the first streamer each time the scene appears
    document.body.dataset.scene = name;
    ['goals', 'donors', 'countdown', 'uptime', 'stream', 'message'].forEach(function (n) {
      $('scene-' + n).classList.toggle('active', n === name);
    });
    syncStream(name);
  }

  // which guest is on screen right now (cycles through the list, or shows the pinned/first one)
  function streamNow() {
    var l = (state && state.streamers) || [];
    if (!l.length) return null;
    var c = state.streamCycle || {};
    if (c.enabled && l.length > 1) {
      var i = Math.floor((Date.now() - streamSince) / ((c.seconds || 45) * 1000)) % l.length;
      i = Math.max(0, i);
      return { name: l[i], i: i, n: l.length };
    }
    var pin = state.streamPinned && l.indexOf(state.streamPinned) >= 0 ? state.streamPinned : l[0];
    return { name: pin, i: l.indexOf(pin), n: l.length };
  }

  function syncStream(active) {
    var f = $('twitch');
    var s = state ? streamNow() : null;
    var showing = active === 'stream';
    $('streamEmpty').style.display = showing && !s ? 'flex' : 'none';
    $('streamLabel').style.display = showing && s ? 'block' : 'none';
    if (showing && s) {
      $('streamLabel').textContent = 'NOW WATCHING · ' + s.name + (s.n > 1 ? '   ' + (s.i + 1) + '/' + s.n : '');
      if (PREVIEW) return;                                  // don't load a second live player inside the control panel
      if (streamKey !== s.name) {
        streamKey = s.name;
        f.src = 'https://player.twitch.tv/?channel=' + encodeURIComponent(s.name) + '&parent=' + encodeURIComponent(location.hostname) + '&muted=true&autoplay=true';
      }
    } else if (streamKey) {
      streamKey = '';
      f.src = 'about:blank';                                // stop playback when not on screen
    }
  }

  function timerInfo(kind) {
    var t = now(), st = Date.parse(state.eventStart), en = Date.parse(state.eventEnd);
    var hasS = !isNaN(st), hasE = !isNaN(en);
    if (!hasS && !hasE) return { label: 'EVENT TIMER', time: '--:--:--', sub: 'Set the event times in the control panel' };
    if (hasS && t < st) return { label: 'MARATHON STARTS IN', time: fmtDur(st - t), sub: 'Get ready!' };
    if (kind === 'countdown') {
      if (hasE) {
        if (t < en) return { label: 'TIME REMAINING', time: fmtDur(en - t), sub: 'until the marathon ends' };
        return { label: 'MARATHON COMPLETE', time: '00:00:00', sub: 'Thank you for supporting the kids!' };
      }
      return { label: 'EVENT TIMER', time: '--:--:--', sub: 'Set an end time to count down' };
    }
    if (hasS) {
      var done = hasE && t >= en;
      var gone = (hasE ? Math.min(t, en) : t) - st;
      return {
        label: done ? 'FINAL TIME' : 'LIVE FOR',
        time: fmtDur(gone),
        sub: done ? 'Thank you for supporting the kids!' : (hasE ? fmtDur(en - t) + ' remaining' : 'and counting')
      };
    }
    return { label: 'UPTIME', time: '--:--:--', sub: 'Set a start time in the control panel' };
  }

  function tick() {
    if (!state) return;
    var a = activeScene();
    if (a !== current) setActive(a);
    else if (a === 'stream') syncStream(a);
    if (a === 'countdown' || a === 'uptime') {
      var i = timerInfo(a), p = a === 'countdown' ? 'cd' : 'up';
      $(p + 'Label').textContent = i.label; $(p + 'Time').textContent = i.time; $(p + 'Sub').textContent = i.sub;
    }
  }

  /* ---------- sync loops ---------- */
  function poll() {
    fetch('/api/state', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { fails = 0; $('conn').classList.remove('on'); applyState(d.state, d.serverTime); })
      .catch(function () { if (++fails >= 3) $('conn').classList.add('on'); })
      .then(function () { setTimeout(poll, POLL_MS); });
  }

  if (PREVIEW) {
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'state') return;
      applyState(e.data.state, e.data.serverTime);
    });
    if (window.parent !== window) window.parent.postMessage({ type: 'ready' }, location.origin);
  } else {
    poll();
  }
  setInterval(tick, 250);
  setInterval(fetchEL, EL_MS);
})();
</script>
</body>
</html>
